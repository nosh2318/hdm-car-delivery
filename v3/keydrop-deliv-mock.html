<title>KEYDROP お届け先を選ぶ（新UXモック・テスト）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCoX1EyEx-N5A0r4vRzC1KmVp3T29HILbI&libraries=places&language=ja&region=JP&loading=async" async></script>
<style>
:root{--navy:#111111;--navy2:#2b2b2b;--ink:#0a0a0a;--y:#FABE00;--gr:#0e9f50;--line:#333333;--mut:#9a9a9a;--bg:#eef2f8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans JP",-apple-system,sans-serif;background:var(--bg);color:#1a1a1a;padding-bottom:96px;overflow-x:hidden}
html{overflow-x:hidden}
.devtag{background:#fff7ed;color:#b45309;font-size:11px;text-align:center;padding:7px;font-weight:800}
header{background:var(--navy);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
header .b{font-weight:900;font-size:18px}header .step{margin-left:auto;background:var(--y);color:#1a1a1a;font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px}
.stbtn{background:transparent;border:1.5px solid #3a4f7b;color:#c8d3ea;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.stbtn.on{background:var(--y);color:#1a1a1a;border-color:var(--y)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.q{font-size:20px;font-weight:900;color:#151515;line-height:1.4;margin:6px 2px 4px}
.qsub{font-size:12.5px;color:#5a6b85;margin:0 2px 14px;line-height:1.6}
.card{background:#fff;border:1px solid #e2e8f2;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(10,30,80,.05)}
/* 検索 */
.searchbox{position:relative}
.searchbox .inp{display:flex;align-items:center;gap:9px;border:2px solid #cbd5e6;border-radius:12px;background:#fff;padding:0 12px;height:52px}
.searchbox .inp.on{border-color:var(--y);box-shadow:0 0 0 3px rgba(250,190,0,.18)}
.searchbox .inp span.ic{font-size:18px;flex:0 0 auto;cursor:pointer}
.searchbox input{flex:1;border:0;outline:none;font-size:15px;font-family:inherit;color:#1a1a1a;background:transparent;min-width:0}
.searchbox .clr{border:0;background:#eef2f8;color:#5a6b85;width:26px;height:26px;border-radius:50%;font-size:15px;cursor:pointer;flex:0 0 auto;display:none}
.sugg{position:absolute;left:0;right:0;top:58px;background:#fff;border:1px solid #dde5f2;border-radius:12px;box-shadow:0 16px 34px rgba(0,0,0,.16);z-index:20;overflow:hidden;display:none;max-height:320px;overflow-y:auto}
.sugg.on{display:block}
.sugg .it{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;border-bottom:1px solid #f0f3f8}
.sugg .it:last-child{border-bottom:0}.sugg .it:active,.sugg .it:hover{background:#f6f9ff}
.sugg .it .si{font-size:18px;flex:0 0 auto;width:22px;text-align:center}
.sugg .it .st{font-size:14px;font-weight:700;color:#151515;line-height:1.35}
.sugg .it .ss{font-size:11px;color:#8090ac}
.sugg .head{font-size:11px;font-weight:800;color:#8090ac;padding:9px 14px 4px;background:#fafbfe}
/* チップ */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1.5px solid #cbd5e6;background:#fff;color:#1a1a1a;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
.chip:active{background:#eef3fb}
/* 地図（センターピン） */
.maparea{position:relative;margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid #dde5f2}
#map,#map2{height:280px;background:#dfe6ee;touch-action:none}
.centerpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:500;pointer-events:none;font-size:38px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));transition:transform .12s}
.maparea.moving .centerpin{transform:translate(-50%,-118%)}
.pinshadow{position:absolute;left:50%;top:50%;width:14px;height:6px;background:rgba(0,0,0,.28);border-radius:50%;transform:translate(-50%,-2px);z-index:499;pointer-events:none}
.maptip{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(17,17,17,.9);color:#fff;font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:9px;z-index:500;text-align:center;line-height:1.5}
.geobtn{position:absolute;right:12px;top:12px;z-index:500;background:#fff;border:1px solid #cbd5e6;border-radius:10px;width:42px;height:42px;font-size:19px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* 選択サマリー */
.selcard{margin-top:14px;background:#f4f9f4;border:1.5px solid #b9e0b9;border-radius:12px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.selcard.empty{background:#fbfcfe;border-color:#e2e8f2}
.selcard .pin{font-size:20px;flex:0 0 auto}
.selcard .lb{font-size:11px;font-weight:800;color:var(--gr)}
.selcard.empty .lb{color:#8090ac}
.selcard .val{font-size:14px;font-weight:800;color:#151515;line-height:1.5;margin-top:2px;word-break:keep-all}
.selcard.empty .val{color:#9aa7bf;font-weight:600}
.selcard.err{background:#fdecec;border-color:#f2b8b8}
.selcard.err .lb{color:#c0392b}.selcard.err .val{color:#b03026;font-weight:800}
.selcard .addr{font-size:12px;color:#0e7a3e;line-height:1.5;margin-top:3px;word-break:break-all}
.selcard .addr:empty{display:none}
/* 回収トグル */
.rettoggle{margin-top:16px;background:#fff;border:1px solid #e2e8f2;border-radius:12px;padding:13px 14px}
.rettoggle .row{display:flex;align-items:center;gap:11px}
.rettoggle .tt{font-weight:800;font-size:14px;color:#151515}
.rettoggle .td{font-size:11.5px;color:#8090ac;margin-top:2px}
.sw{margin-left:auto;flex:0 0 auto;width:50px;height:28px;border-radius:999px;background:var(--y);position:relative;cursor:pointer;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:25px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.off{background:#c3ccdb}.sw.off::after{left:3px}
.retbody{margin-top:14px;display:none}.retbody.on{display:block}
.retlead{font-size:12.5px;font-weight:800;color:#151515;margin:2px 2px 8px}
/* フッター */
.cta{position:fixed;left:0;right:0;bottom:0;background:rgba(17,17,17,.97);backdrop-filter:blur(8px);border-top:2px solid var(--y);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:40}
.cta .sum{font-size:11px;color:#b9b9b9;flex:1 1 auto;min-width:0;line-height:1.4}
.cta .sum b{color:#fff;font-weight:800}
.cta button{background:var(--y);color:#1a1a1a;border:0;border-radius:10px;padding:13px 24px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;white-space:nowrap}
.cta button:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:11px;color:#8090ac;margin-top:14px;line-height:1.7;text-align:center}
@media(max-width:430px){.q{font-size:18px}.cta{padding:10px 12px;gap:8px}.cta button{padding:12px 16px;font-size:13.5px}}
/* 埋め込み(本フロー内)モード＝自前のヘッダー/タイトル/CTA/注記を隠す */
html.embed body{padding-bottom:0;background:#fff}
html.embed .devtag,html.embed header,html.embed .q,html.embed .cta{display:none}
html.embed .wrap{padding:0}
html.embed .card{border:0;box-shadow:none;padding:0}
html.embed .qsub{margin:0 2px 12px}
.mapph{position:absolute;inset:0;z-index:600;background:linear-gradient(180deg,#eef2f8,#e4eaf3);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:15px;font-weight:900;color:#1a1a1a;cursor:pointer;font-family:inherit}
.mapph small{font-weight:700;color:#5a6b85;font-size:11.5px}
.mapph .mi{font-size:30px}
</style></head>
<body>
<div class="devtag">🛠 KEYDROP デリバリー 新UXモック（テスト環境・本番未接続）／PC・スマホ両対応</div>
<header><span class="b"><span style="color:var(--y)">KEY</span>DROP</span>
  <span style="font-size:12px;color:#c8d3ea" data-di="hdr">お届け先を選ぶ</span>
  <span style="margin-left:auto;display:inline-flex;gap:6px" id="storeSw">
    <button type="button" class="stbtn" data-s="naha" onclick="switchStore('naha')">🌺 那覇</button>
    <button type="button" class="stbtn" data-s="sapporo" onclick="switchStore('sapporo')">❄️ 札幌</button>
  </span></header>

<div class="wrap">
  <div class="q" data-di="q">車をどこにお届けしますか？</div>
  <div class="qsub" data-di-html="qsub">ホテル名・住所・駅名で検索するか、地図を動かしてピンを合わせてください。<b style="color:var(--gr)">回収も同じ場所が既定</b>です。</div>

  <div class="card">
    <div class="searchbox">
      <div class="inp" id="sInp"><span class="ic" onclick="submitSearch(1)" title="検索">🔍</span><input id="q" placeholder="ホテル名・住所・駅名で検索" data-di-ph="ph1" autocomplete="off"><button class="clr" id="clr" onclick="clearQ()">×</button></div>
      <div class="sugg" id="sugg"></div>
    </div>
    <div class="maparea" id="maparea">
      <div id="map"></div>
      <div class="pinshadow"></div>
      <div class="centerpin">📍</div>
      <button class="geobtn" onclick="locateMe()" title="現在地">🎯</button>
      <div class="maptip" id="maptip" data-di="maptip">地図を動かして、お届けしたい場所にピンを合わせてください</div>
    </div>

    <div class="selcard empty" id="selcard">
      <span class="pin">📍</span>
      <div style="min-width:0"><div class="lb" data-di="lb_del">お届け先</div><div class="val" id="selval" data-di="sel_empty">場所を選ぶと、ここに表示されます</div><div class="addr" id="seladdr"></div></div>
    </div>
  </div>

  <div class="rettoggle">
    <div class="row">
      <div><div class="tt" data-di="ret_tt">🔄 回収も同じ場所にする</div><div class="td" data-di="ret_td">別の場所で返す場合はオフに</div></div>
      <div class="sw" id="sameSw" onclick="toggleSame()"></div>
    </div>
    <div class="retbody" id="retbody">
      <div class="retlead" data-di="ret_lead">🏁 回収（返却）先を選ぶ</div>
      <div class="searchbox">
        <div class="inp" id="sInp2"><span class="ic" onclick="submitSearch(2)" title="検索">🔍</span><input id="q2" placeholder="回収先を検索" data-di-ph="ph2" autocomplete="off"><button class="clr" id="clr2" onclick="clearQ(2)">×</button></div>
        <div class="sugg" id="sugg2"></div>
      </div>
      <div class="maparea" id="maparea2">
        <div id="map2"></div>
        <div class="pinshadow"></div>
        <div class="centerpin">🏁</div>
        <div class="maptip" id="maptip2" data-di="maptip2">回収してほしい場所にピンを合わせてください</div>
      </div>
      <div class="selcard empty" id="selcard2">
        <span class="pin">🏁</span>
        <div style="min-width:0"><div class="lb" data-di="lb_col">回収先</div><div class="val" id="selval2" data-di="sel_empty">場所を選ぶと、ここに表示されます</div><div class="addr" id="seladdr2"></div></div>
      </div>
    </div>
  </div>

  <div class="note" id="noteBox"></div>
</div>

<div class="cta">
  <div class="sum" id="ctaSum">お届け先を選んでください</div>
  <button id="nextBtn" disabled onclick="alert('（試作）この後の画面へ進みます。\\nお届け先: '+(loc.del||'-')+'\\n回収先: '+(same?'同じ場所':(loc.col||'-')))">次へ →</button>
</div>

 ko:{hdr:'배달 장소 선택',q:'차량을 어디로 배달할까요?',qsub:'호텔·주소·역 이름으로 검색하거나 지도를 움직여 핀을 맞추세요. <b style="color:var(--gr)">회수도 같은 장소가 기본</b>입니다.',ph1:'호텔·주소·역 검색',maptip:'지도를 움직여 배달 원하는 위치에 핀을 맞추세요',lb_del:'배달 장소',sel_empty:'장소를 선택하면 여기에 표시됩니다',ret_tt:'🔄 회수도 같은 장소로',ret_td:'다른 장소에서 반납하려면 끄세요',ret_lead:'🏁 회수(반납) 장소 선택',ph2:'회수 장소 검색',maptip2:'회수 원하는 위치에 핀을 맞추세요',lb_col:'회수 장소',note:'<b style="color:var(--gr)">배달·회수는 {area}만</b> 가능합니다. 영업시간 9:00〜19:00.<br>코인주차장·자택·호텔·역 등 어디든 OK(지도에서 지정).',mapph_a:'지도에서 위치 지정',mapph_b:'탭하여 지도 열기',noresult:'해당 후보가 없습니다. 지도를 움직여 핀으로 지정하세요.',err_air:'🚫 공항은 배달 대상 외입니다.<br>시내 장소를 지정해 주세요.',err_area:'🚫 서비스 지역 밖입니다.<br>배달·회수는 <b>{area}</b>만 가능합니다.',cta_empty:'배달 장소를 선택하세요'}
};
function diT(k){var d=DI[_dlang]||DI.ja;return (d[k]!=null?d[k]:(DI.ja[k]!=null?DI.ja[k]:k));}
function renderNote(){var nb=document.getElementById('noteBox');if(nb)nb.innerHTML=diT('note').replace('{area}',curAreaLabel());}
function applyDI(){
 document.querySelectorAll('[data-di]').forEach(function(el){
   if(el.id==='selval'||el.id==='selval2'){var sc=el.closest('.selcard');if(sc&&!sc.classList.contains('empty'))return;}
   el.textContent=diT(el.getAttribute('data-di'));
 });
 document.querySelectorAll('[data-di-html]').forEach(function(el){el.innerHTML=diT(el.getAttribute('data-di-html'));});
 document.querySelectorAll('[data-di-ph]').forEach(function(el){el.setAttribute('placeholder',diT(el.getAttribute('data-di-ph')));});
 var ph=document.querySelector('.mapph');if(ph)ph.innerHTML='<span class="mi">🗺</span>'+diT('mapph_a')+'<small>'+diT('mapph_b')+'</small>';
 renderNote();try{renderCta();}catch(e){}
}

function switchStore(s){var p=new URLSearchParams(location.search);p.set('area',s);location.search=p.toString();}
var loc={del:'',col:''},locName={del:'',col:''},_ll={del:null,col:null},_lastCommit={},same=true,maps={},moveTimer={},suppress={map:0,map2:0};
function dist(a,b,c,d){var R=6371,dLat=(c-a)*Math.PI/180,dLng=(d-b)*Math.PI/180,x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function isAirport(lat,lng,name){if(AIRPORT){if(name&&/那覇空港/.test(name))return true;if(lat!=null&&dist(lat,lng,AIRPORT[0],AIRPORT[1])<1.1)return true;}return false;}
function inCity(comps,addr){function hit(s){if(!s)return false;for(var i=0;i<AREAS.length;i++){if(s.indexOf(AREAS[i])>=0)return true;}return false;}
  if(comps&&comps.length){for(var j=0;j<comps.length;j++){if(hit(comps[j].long_name))return true;}return false;}return hit(addr);}
function postState(){if(!_EMBED||window.parent===window)return;function o(k){return loc[k]?{label:locName[k]||loc[k],addr:loc[k],lat:_ll[k]?_ll[k][0]:null,lng:_ll[k]?_ll[k][1]:null}:null;}try{window.parent.postMessage({type:'hdmdeliv',del:o('del'),col:same?null:o('col'),same:same,height:document.body.scrollHeight+8},'*');}catch(e){}}

function makeMap(id,which){
  // Google Maps（本番KEYDROPと同じGoogleマップ）＋中央ピン方式
  var el=document.getElementById(id);
  var m=new google.maps.Map(el,{center:{lat:CENTER[0],lng:CENTER[1]},zoom:14,disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy',clickableIcons:false,keyboardShortcuts:false});
  var areaEl=document.getElementById(id==='map'?'maparea':'maparea2');
  var touched=false;
  m.addListener('dragstart',function(){touched=true;areaEl.classList.add('moving');});
  m.addListener('zoom_changed',function(){touched=true;});
  m.addListener('idle',function(){
    areaEl.classList.remove('moving');
    if(!touched)return;                        // 初期表示のidleでは確定しない（ユーザー操作後のみ）
    if(Date.now()<suppress[id]){return;}       // 検索選択直後の自動移動は無視
    clearTimeout(moveTimer[id]);moveTimer[id]=setTimeout(function(){
      var c=m.getCenter();var la=c.lat(),ln=c.lng();var kk=which===2?'col':'del';
      if(_lastCommit[id]&&locName[kk]&&dist(la,ln,_lastCommit[id][0],_lastCommit[id][1])<0.06){return;} // 選択直後の微小settleでは施設名を保持
      reverseGeo(la,ln,function(ad,comps){apply(which,'',ad,la,ln,comps);});
    },500);
  });
  // 埋め込み(iframe)ではサイズ確定が遅れるため、複数回リサイズして必ずタイルを描画
  [200,600,1200,2000].forEach(function(ms){setTimeout(function(){google.maps.event.trigger(m,'resize');m.setCenter({lat:CENTER[0],lng:CENTER[1]});},ms);});
  return m;
}
/* ==== Google Places（Maps JS）で検索・座標化 ==== */
var gAuto=null,gPlaces=null,gGeo=null,NAHA_LL=null,predTimer={},lastPreds={1:[],2:[]};
function gInit(){if(window.google&&google.maps&&google.maps.places&&!gAuto){gAuto=new google.maps.places.AutocompleteService();gPlaces=new google.maps.places.PlacesService(document.createElement('div'));gGeo=new google.maps.Geocoder();NAHA_LL=new google.maps.LatLng(CENTER[0],CENTER[1]);}}
function gWait(cb){gInit();if(gAuto){cb();return;}var t=0;var iv=setInterval(function(){gInit();if(gAuto||t++>40){clearInterval(iv);cb();}},150);}
var _sessTok=null;
function _tok(){if(!_sessTok&&window.google&&google.maps&&google.maps.places)_sessTok=new google.maps.places.AutocompleteSessionToken();return _sessTok;}
function predict(input,cb){gWait(function(){if(!gAuto){cb([]);return;}
  var req={input:input,language:_dlang,componentRestrictions:{country:'jp'},location:NAHA_LL,radius:25000,sessionToken:_tok()};
  gAuto.getPlacePredictions(req,function(p,st){
    if(st==='OK'&&p){cb(p);return;}
    if(window.google&&st===google.maps.places.PlacesServiceStatus.OVER_QUERY_LIMIT){setTimeout(function(){gAuto.getPlacePredictions(req,function(p2,st2){cb((st2==='OK'&&p2)?p2:[]);});},700);return;}
    cb([]);
  });
});}
function details(placeId,cb){gWait(function(){if(!gPlaces){cb(null);return;}gPlaces.getDetails({placeId:placeId,fields:['geometry','name','formatted_address','address_components'],language:_dlang,sessionToken:_tok()},function(pl,st){_sessTok=null;if(st==='OK'&&pl&&pl.geometry){cb(pl.geometry.location.lat(),pl.geometry.location.lng(),pl.name||'',gtidy(pl.formatted_address),pl.address_components||null);}else cb(null);});});}
function gtidy(a){return (a||'').replace(/^日本、?/,'').replace(/,?\s*日本$/,'').replace(/,?\s*Japan$/i,'').replace(/〒?\d{3}-?\d{4}\s*/,'').replace(/^沖縄県/,'').trim();}
function reverseGeo(lat,lng,cb){gWait(function(){if(!gGeo){cb(lat.toFixed(4)+', '+lng.toFixed(4),null);return;}gGeo.geocode({location:{lat:lat,lng:lng},language:_dlang},function(res,st){if(st==='OK'&&res&&res[0])cb(gtidy(res[0].formatted_address),res[0].address_components);else cb(lat.toFixed(4)+', '+lng.toFixed(4),null);});});}
function regeoAll(){['del','col'].forEach(function(k){if(_ll[k]){var vid=(k==='col')?'selval2':'selval',aid=(k==='col')?'seladdr2':'seladdr';reverseGeo(_ll[k][0],_ll[k][1],function(ad){loc[k]=ad;var nm=locName[k];var ve=document.getElementById(vid),ae=document.getElementById(aid);if(ve)ve.textContent=nm||ad;if(ae)ae.textContent=(nm&&ad&&ad!==nm)?('\ud83d\udcee '+ad):'';postState();});}});}
function apply(which,name,addr,lat,lng,comps){var k=which===2?'col':'del';var sc=document.getElementById(which===2?'selcard2':'selcard');var vid=which===2?'selval2':'selval';var aid=which===2?'seladdr2':'seladdr';
  if(isAirport(lat,lng,(name||'')+' '+(addr||''))){loc[k]='';locName[k]='';_ll[k]=null;sc.className='selcard err';document.getElementById(vid).innerHTML=diT('err_air');document.getElementById(aid).textContent='';renderCta();return;}
  if(!inArea(lat,lng)){loc[k]='';locName[k]='';_ll[k]=null;sc.className='selcard err';document.getElementById(vid).innerHTML=diT('err_area').replace('{area}',curAreaLabel());document.getElementById(aid).textContent='';renderCta();return;}
  loc[k]=addr||name||'';locName[k]=name||'';if(lat!=null)_ll[k]=[lat,lng];sc.className='selcard';
  document.getElementById(vid).textContent=name||addr||'';
  document.getElementById(aid).textContent=(name&&addr&&addr!==name)?('📮 '+addr):'';
  renderCta();}
function commit(which,name,addr,lat,lng,comps){var mid=which===2?'map2':'map';
  if(lat!=null){
    if(maps[mid]){suppress[mid]=Date.now()+1800;_lastCommit[mid]=[lat,lng];maps[mid].setCenter({lat:lat,lng:lng});maps[mid].setZoom(16);}
    else{ // スマホ遅延: 検索確定時に地図を生成し、選択地点を確認表示
      var ar=document.getElementById(which===2?'maparea2':'maparea');var ph=ar&&ar.querySelector('.mapph');if(ph)ph.remove();
      gWait(function(){maps[mid]=makeMap(mid,which);suppress[mid]=Date.now()+2400;_lastCommit[mid]=[lat,lng];maps[mid].setCenter({lat:lat,lng:lng});maps[mid].setZoom(16);});
    }
  }
  apply(which,name,addr,lat,lng,comps);}

function renderCta(){var ok=!!loc.del&&(same||!!loc.col);var btn=document.getElementById('nextBtn');if(btn)btn.disabled=!ok;
  var s=document.getElementById('ctaSum');
  if(s){if(!loc.del)s.innerHTML=diT('cta_empty');else s.innerHTML='<b>お届け:</b> '+esc(locName.del||loc.del)+(same?'　<b>回収:</b> 同じ場所':(loc.col?('　<b>回収:</b> '+esc(locName.col||loc.col)):'　<b>回収先</b>を選んでください'));}
  postState();}
function esc(s){return (s||'').replace(/[<>&]/g,'');}

/* 検索サジェスト（Google Places・那覇周辺を優先） */
function renderSugg(which){var q=(document.getElementById(which===2?'q2':'q').value||'').trim();var box=document.getElementById(which===2?'sugg2':'sugg');
  if(!q){box.classList.remove('on');return;}
  clearTimeout(predTimer[which]);predTimer[which]=setTimeout(function(){predict(q,function(preds){lastPreds[which]=preds;
    if(!preds.length){box.innerHTML='<div class="head" style="color:#8090ac;padding:11px 14px">'+diT('noresult')+'</div>';box.classList.add('on');return;}
    box.innerHTML=preds.slice(0,6).map(function(p,i){var m=p.structured_formatting||{};return '<div class="it" data-i="'+i+'"><span class="si">📍</span><div><div class="st">'+esc(m.main_text||p.description)+'</div><div class="ss">'+esc(m.secondary_text||'')+'</div></div></div>';}).join('');
    box.querySelectorAll('.it').forEach(function(el){el.onclick=function(){pick(preds[+el.getAttribute('data-i')],which);};});
    box.classList.add('on');
  });},350);
}
function pick(pred,which){var box=document.getElementById(which===2?'sugg2':'sugg');box.classList.remove('on');
  var inp=document.getElementById(which===2?'q2':'q');var label=(pred.structured_formatting&&pred.structured_formatting.main_text)||pred.description;inp.value=label;
  details(pred.place_id,function(lat,lng,nm,addr,comps){commit(which,nm||label,addr||pred.description||'',lat,lng,comps);});
}
function submitSearch(which){var inp=document.getElementById(which===2?'q2':'q');var q=(inp.value||'').trim();
  document.getElementById(which===2?'sugg2':'sugg').classList.remove('on');
  if(!q)return;
  var preds=lastPreds[which];
  if(preds&&preds.length){pick(preds[0],which);return;}
  predict(q,function(p){if(p&&p[0])pick(p[0],which);});
}
function clearQ(which){document.getElementById(which===2?'q2':'q').value='';document.getElementById(which===2?'sugg2':'sugg').classList.remove('on');document.getElementById(which===2?'clr2':'clr').style.display='none';}
function toggleSame(){same=!same;document.getElementById('sameSw').classList.toggle('off',!same);document.getElementById('retbody').classList.toggle('on',!same);
  if(!same){var mk=function(){gWait(function(){if(!maps.map2){maps.map2=makeMap('map2',2);}setTimeout(function(){if(maps.map2){google.maps.event.trigger(maps.map2,'resize');maps.map2.setCenter({lat:CENTER[0],lng:CENTER[1]});}},350);});};if(window.innerWidth>820||maps.map2){mk();}else{showMapPh('maparea2',mk);}}renderCta();}
function locateMe(){if(!navigator.geolocation||!maps.map)return;navigator.geolocation.getCurrentPosition(function(p){maps.map.setCenter({lat:p.coords.latitude,lng:p.coords.longitude});maps.map.setZoom(16);},function(){});}

function showMapPh(areaId,onload){var a=document.getElementById(areaId);if(!a||a.querySelector('.mapph'))return;var b=document.createElement('button');b.type='button';b.className='mapph';b.innerHTML='<span class="mi">🗺</span>'+diT('mapph_a')+'<small>'+diT('mapph_b')+'</small>';b.onclick=function(){b.remove();onload();};a.appendChild(b);}
window.addEventListener('DOMContentLoaded',function(){
  if(_EMBED)document.documentElement.classList.add('embed');
  var sb=document.querySelector('#storeSw .stbtn[data-s="'+_AREA+'"]');if(sb)sb.classList.add('on');
  applyDI();
  window.addEventListener('message',function(e){var d=e.data;if(d&&d.type==='kdlang'&&d.lang){_dlang=d.lang;applyDI();regeoAll();}});
  // スマホは地図タイルを初期読込せず、タップで読み込む（検索優先UX・軽量化）。PCは自動表示
  if(window.innerWidth>820){ gWait(function(){maps.map=makeMap('map',1);}); }
  else { showMapPh('maparea',function(){gWait(function(){maps.map=makeMap('map',1);});}); }
  document.getElementById('sameSw').classList.remove('off'); // 既定ON
  postState(); // 初期状態(未選択)を親へ
  setInterval(postState,1200); // 高さ変化も定期通知
  ['q','q2'].forEach(function(id,idx){var el=document.getElementById(id);if(!el)return;var which=idx===0?1:2;
    el.addEventListener('input',function(){document.getElementById(which===2?'clr2':'clr').style.display=el.value?'flex':'none';document.getElementById(which===2?'sInp2':'sInp').classList.toggle('on',!!el.value);renderSugg(which);});
    el.addEventListener('focus',function(){renderSugg(which);});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();submitSearch(which);el.blur();}}); // IME変換確定Enterでは検索しない
    el.addEventListener('compositionend',function(){renderSugg(which);}); // 日本語変換確定後に候補を出す
    el.setAttribute('enterkeyhint','search');
  });
  document.addEventListener('click',function(e){if(!e.target.closest('.searchbox')){document.getElementById('sugg').classList.remove('on');var s2=document.getElementById('sugg2');if(s2)s2.classList.remove('on');}});
});
</script>
